<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimensio — Assistente de Operação</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 320px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #111827;
        font-size: 13px;
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px;
        background: #4f46e5; color: #fff;
      }
      header h1 { font-size: 13px; font-weight: 800; flex: 1; }
      header .dot { width: 9px; height: 9px; border-radius: 50%; background: #fde047; box-shadow: 0 0 8px #fde047; }
      header .dot.off { background: #9ca3af; box-shadow: none; }
      
      .tabs {
        display: flex; background: #e0e7ff; border-bottom: 1px solid #c7d2fe;
      }
      .tab-btn {
        flex: 1; padding: 8px 10px; font-weight: 700; font-size: 11px;
        border: none; background: transparent; color: #4338ca; cursor: pointer;
        text-align: center; border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        background: #fff; color: #4f46e5; border-bottom-color: #4f46e5;
      }

      .body { padding: 12px 14px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .muted { color: #6b7280; font-size: 11px; }
      .title-box {
        background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px;
        padding: 8px 10px; margin-bottom: 10px; font-weight: 700; word-break: break-word;
      }
      .names { margin-bottom: 10px; max-height: 180px; overflow-y: auto; }
      .name {
        display: flex; align-items: center; gap: 8px;
        background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 6px 10px; margin-bottom: 6px;
      }
      .name .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
      .name .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .name .rm {
        background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; padding: 2px;
      }
      .add { display: flex; gap: 6px; margin-bottom: 10px; }
      .add input, .search-box input {
        flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 8px; font-size: 12px; outline: none; width: 100%;
      }
      .add input:focus, .search-box input:focus { border-color: #4f46e5; }
      
      button.primary {
        background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 6px 10px;
        font-weight: 700; cursor: pointer; font-size: 12px;
      }
      button.secondary {
        background: #fff; color: #111827; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 10px;
        font-weight: 700; cursor: pointer; font-size: 12px;
      }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .switch { display: flex; align-items: center; gap: 8px; }
      .switch input { accent-color: #4f46e5; }
      .empty { color: #6b7280; font-style: italic; font-size: 12px; padding: 6px 0; }
      
      /* Quick Fill Card list */
      .qf-list { max-height: 220px; overflow-y: auto; margin-top: 8px; }
      .qf-item {
        background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 8px 10px; margin-bottom: 6px; display: flex; flex-col; gap: 4px;
      }
      .qf-item .header-row { display: flex; justify-content: space-between; align-items: center; }
      .qf-item .title { font-weight: 700; color: #1f2937; font-size: 11.5px; }
      .qf-item .badge { font-size: 9.5px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; }
      .qf-item .code-row { display: flex; items-center; gap: 6px; margin-top: 4px; }
      .qf-item .code { font-family: monospace; font-size: 11px; font-weight: 700; background: #f3f4f6; color: #111827; padding: 4px 6px; border-radius: 4px; flex: 1; border: 1px solid #e5e7eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .qf-item .copy-btn { background: #4f46e5; color: #fff; border: none; padding: 4px 8px; font-size: 10.5px; font-weight: 700; border-radius: 6px; cursor: pointer; shrink: 0; }
      .qf-item .copy-btn.copied { background: #059669; }

      footer { padding: 10px 14px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
      .info { margin-top: 8px; font-size: 11px; color: #6b7280; }

      /* Automa: cartões expansíveis das coletas */
      #metricsList { max-height: 340px; overflow-y: auto; }
      .auto-card {
        background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
        margin-bottom: 8px; overflow: hidden;
      }
      .auto-head {
        display: flex; align-items: center; gap: 6px; padding: 8px 10px;
        cursor: pointer; background: #fafafa;
      }
      .auto-head:hover { background: #f3f4f6; }
      .auto-head .caret { font-size: 10px; color: #6b7280; transition: transform .15s; flex-shrink: 0; }
      .auto-head.open .caret { transform: rotate(90deg); }
      .auto-head .title { font-weight: 800; color: #1f2937; font-size: 11.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .auto-badge {
        font-size: 9px; font-weight: 700; border-radius: 5px; padding: 2px 5px; white-space: nowrap; flex-shrink: 0;
      }
      .badge-count { background: #d1fae5; color: #047857; }
      .badge-extract { background: #e0e7ff; color: #3730a3; }
      .badge-flow { background: #f3e8ff; color: #7c3aed; }
      .badge-steps { background: #fef3c7; color: #92400e; }
      .auto-body { padding: 8px 10px; border-top: 1px solid #f3f4f6; }
      .auto-section { margin-bottom: 8px; }
      .auto-section > .sec-label {
        font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
        color: #6b7280; margin-bottom: 5px; display: flex; align-items: center; gap: 4px;
      }
      .auto-row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
      .auto-row input[type="text"], .auto-row select {
        flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 6px;
        padding: 4px 6px; font-size: 11px; outline: none;
      }
      .auto-row input[type="text"]:focus, .auto-row select:focus { border-color: #7c3aed; }
      .auto-step {
        background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 8px;
        padding: 5px 7px; margin-bottom: 4px;
      }
      .auto-step .step-head { display: flex; align-items: center; gap: 5px; }
      .auto-step .step-num {
        width: 16px; height: 16px; border-radius: 5px; background: #7c3aed; color: #fff;
        font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .auto-step .step-sum { flex: 1; min-width: 0; font-size: 10.5px; color: #4c1d95; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .auto-step .step-actions { display: flex; gap: 2px; flex-shrink: 0; }
      .auto-step .step-actions button {
        border: none; background: #ede9fe; color: #6d28d9; border-radius: 5px;
        width: 18px; height: 18px; font-size: 10px; font-weight: 800; cursor: pointer;
      }
      .auto-step .step-actions button.del { color: #dc2626; background: #fee2e2; }
      .btn-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
      .mini-btn {
        border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 6px;
        padding: 4px 8px; font-size: 10px; font-weight: 700; cursor: pointer;
      }
      .mini-btn.violet { border-color: #c4b5fd; color: #7c3aed; background: #faf5ff; }
      .mini-btn.green { border-color: #a7f3d0; color: #047857; background: #ecfdf5; }
      .mini-btn.red { border-color: #fecaca; color: #dc2626; background: #fef2f2; }
      .mini-btn.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
      .empty-term { font-size: 10px; color: #9ca3af; font-style: italic; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>Dimensio — Assistente de Operação</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabHighlightBtn">🎯 Destaque Nomes</button>
      <button class="tab-btn" id="tabQuickFillBtn">⚡ Preenchimento Rápido</button>
      <button class="tab-btn" id="tabMetricsBtn">📊 Métricas</button>
    </div>

    <!-- Section 1: Highlight Names -->
    <div id="sectionHighlight" class="body">
      <div class="switch">
        <label for="enabled">Destaque ativo</label>
        <input type="checkbox" id="enabled" checked />
      </div>

      <div class="title-box" id="titleBox" hidden></div>

      <div class="row">
        <span class="muted">Nomes marcados para acompanhar:</span>
      </div>
      <div class="names" id="names"></div>
      <div class="add">
        <input id="addInput" type="text" placeholder="Adicionar nome..." />
        <button class="primary" id="addBtn">Adicionar</button>
      </div>
      <div class="info" id="info">Aguardando nomes...</div>
    </div>

    <!-- Section 2: Quick Fill / Preenchimento Rápido -->
    <div id="sectionQuickFill" class="body" style="display: none;">
      <div class="search-box">
        <input id="qfSearchInput" type="text" placeholder="🔍 Pesquisar impressora, código, tag..." />
      </div>
      <div class="qf-list" id="qfList"></div>
      <div class="info" id="qfInfo">Sincronizado com o Hub de Informações.</div>
    </div>

    <!-- Section 3: Métricas -->
    <div id="sectionMetrics" class="body" style="display: none;">
      <p class="muted" style="margin-bottom:8px;">Coletas pendentes de métricas cadastradas no Dimensio:</p>
      <div id="metricsList"></div>
      <div class="info" style="margin-top:10px;">Últimas coletas recebidas:</div>
      <div id="metricsResults"></div>
    </div>

    <footer>
      <button class="secondary" id="clearBtn">Limpar tudo</button>
      <button class="secondary" id="globalSearchBtn">⌕ Busca Global</button>
      <button class="primary" id="navBtn">⤢ Navegar na página</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
